  <title>GESP 码力觉醒 — 支持与法律文档</title>
  <style>
    :root { --bg: #f8f9fb; --card: #ffffff; --text: #1c1e21; --muted: #5f6672; --accent: #ff6b00; --border: #e6e8ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121417; --card: #1b1f24; --text: #f0f2f5; --muted: #9aa2ad; --accent: #ff8533; --border: #2b313a; }

    p.sub { margin: 0 0 24px; color: var(--muted); }

    a.item { display: block; padding: 16px 18px; border: 1px solid var(--border); border-radius: 12px; text-decoration: none; color: var(--text); font-weight: 600; transition: border-color .15s; }
    a.item:hover { border-color: var(--accent); }
    a.item span { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 4px; }
    footer { margin-top: 24px; font-size: 12px; color: var(--muted); }

</head>
